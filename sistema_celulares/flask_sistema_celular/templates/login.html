
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <title>Login</title>
</head>

<body>
  <main class="login">
    <div class="card">
      <h2>Assistência Técnica de Celulares 📱</h2>

      <div id="msg" class="msg"></div>

      <form id="f">
        <label>
          Usuário
          <input id="login" autocomplete="username">
        </label>

        <label>
          Senha
          <input
            id="senha"
            type="password"
            autocomplete="current-password"
          >
        </label>

        <button>Entrar</button>
      </form>
    </div>
  </main>

  <script src="/static/app.js"></script>

  <script>
    // Veio de uma sessão expirada? (/login?expirou=1)
    if (new URLSearchParams(location.search).get("expirou")) {
      mensagem("erro", "Sessão expirada. Entre novamente.");
    }

    // Entrar: se der certo vai para a tela principal;
    // se der erro, mostra a mensagem e limpa a senha
    const formularioLogin = document.getElementById("f");
    const campoLogin = document.getElementById("login");
    const campoSenha = document.getElementById("senha");

    formularioLogin.addEventListener("submit", async e => {
      e.preventDefault();
      try {
        await api("/api/login", "POST", {
          login: campoLogin.value,
          senha: campoSenha.value
        });
        location.href = "/principal";
      } catch (err) {
        mensagem("erro", err.message);
        campoSenha.value = "";
      }
    });
  </script>
</body>

</html>
